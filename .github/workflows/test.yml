name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, ship/vnext-rewrite]

jobs:
  test-and-notebooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run pytest (accept no-tests-yet during migration)
        run: |
          set +e
          pytest
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then
            exit "$code"
          fi

      - name: Verify notebooks are clean
        run: |
          nbdev_clean
          if [ -n "$(git status --porcelain nbs)" ]; then
            echo "Detected unclean notebooks after nbdev_clean. Run nbdev_clean locally and commit results."
            git status --porcelain nbs
            exit 1
          fi

      - name: Execute notebook tests
        run: nbdev_test
